# Routes for services running directly on the Pi host (not in Docker).
# For Dockerized services, use Traefik labels on the container instead.
# Rename svc-* to something meaningful (e.g. grafana, homeassistant).

http:
  routers:
    stocks:
      rule: "Host(`stocks.coma.henriksen.es`)"
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares: [authelia]
      service: stocks

    etf:
      rule: "Host(`etf.coma.henriksen.es`)"
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares: [authelia]
      service: etf

    oil:
      rule: "Host(`oil.coma.henriksen.es`)"
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares: [authelia]
      service: oil

    futures:
      rule: "Host(`futures.coma.henriksen.es`)"
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares: [authelia]
      service: futures

    options:
      rule: "Host(`options.coma.henriksen.es`)"
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares: [authelia]
      service: options

    deep:
      rule: "Host(`deep.coma.henriksen.es`)"
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares: [authelia]
      service: deep

    shop:
      rule: "Host(`shop.coma.henriksen.es`)"
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares: [authelia]
      service: shop

    astro:
      rule: "Host(`astro.coma.henriksen.es`)"
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares: [authelia]
      service: astro

    conference:
      rule: "Host(`conference.coma.henriksen.es`)"
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares: [authelia]
      service: conference

    retro:
      rule: "Host(`retro.coma.henriksen.es`)"
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares: [authelia]
      service: retro

  services:
    stocks:
      loadBalancer:
        servers:
          - url: "http://192.168.1.140:9000"

    etf:
      loadBalancer:
        servers:
          - url: "http://192.168.1.140:9001"

    oil:
      loadBalancer:
        servers:
          - url: "http://192.168.1.140:5000"

    futures:
      loadBalancer:
        servers:
          - url: "http://192.168.1.140:7000"

    options:
      loadBalancer:
        servers:
          - url: "http://192.168.1.140:9003"

    deep:
      loadBalancer:
        servers:
          - url: "http://192.168.1.140:9005"

    shop:
      loadBalancer:
        servers:
          - url: "http://192.168.1.140:9007"

    astro:
      loadBalancer:
        servers:
          - url: "http://192.168.1.140:8000"

    conference:
      loadBalancer:
        servers:
          - url: "http://192.168.1.140:9008"

    retro:
      loadBalancer:
        servers:
          - url: "http://192.168.1.140:8877"

